{% extends "base.html" %}

{% block title %}My TODO List{% endblock %}

{% block content %}
<h1>My TODO List</h1>

<form method="post" action="{% url 'add_todo' %}" style="display: flex; align-items: center; gap: 5px; margin-bottom: 20px;">
  {% csrf_token %}
  <input type="text" name="title" placeholder="Enter a new todo item" required style="padding: 5px; width: 400px;">
  <button type="submit" style="padding: 5px 10px; width: 100px; cursor: pointer;">Add</button>
</form>

<ul style="list-style: none; padding: 0;">
  {% for todo in todos %}
  <li style="margin: 10px 0; display: flex; align-items: center; gap: 10px;">
    <form method="post" action="{% url 'toggle_todo' todo.id %}" style="display: inline;">
      {% csrf_token %}
      <button type="submit" style="padding: 3px 10px; cursor: pointer; font-size: 12px;">
        {% if todo.completed %}✓{% else %}○{% endif %}
      </button>
    </form>
    <span style="{% if todo.completed %}text-decoration: line-through; color: gray;{% endif %}">
      {{ todo.title }}
    </span>
  </li>
  {% empty %}
  <li>No TODO items have been added yet.</li>
  {% endfor %}
</ul>

{% endblock %}
